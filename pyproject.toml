[project]
name = "datathon-hack"
version = "0.1.0"
description = "Setu - KSP Crime Database Conversational AI"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "scikit-learn>=1.4",
    "numpy>=1.26",
    "reportlab>=4.0",
    "pypdf>=4.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["functions"]
